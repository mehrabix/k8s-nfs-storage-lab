name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: lint the scripts
        run: shellcheck -S warning scripts/*.sh scenarios/*/*.sh

      - name: lint the workflows
        run: |
          bash <(curl -fsSL \
            https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  manifests:
    name: manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: validate against the Kubernetes schemas
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          args: >-
            -summary -strict -ignore-missing-schemas
            -kubernetes-version 1.34.0
            scenarios/01-pvc-pending/manifests

  scenario:
    name: scenario 01 (broken state)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A cluster is created by hand rather than with an action so that there
      # is no cleanup step to fail: the runner is thrown away anyway, and a
      # flaky cluster teardown should not turn a passing test red.
      - name: create a cluster
        run: |
          curl -fsSLo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind create cluster --name ripple-ci

      # The broken state needs no working NFS: the whole point of the scenario
      # is that nothing provisions the claim. So this runs anywhere.
      - name: deploy the broken state
        run: make up

      - name: assert the broken state
        run: make verify-broken

      - name: the diagnosis script must run cleanly
        run: make diagnose

      - name: every manifest must be accepted by the API server
        run: |
          set -euo pipefail
          for f in scenarios/*/manifests/*.yaml; do
            echo "::group::$f"
            kubectl apply --dry-run=server -f "$f"
            echo "::endgroup::"
          done

      - name: dump the cluster if anything went wrong
        if: failure()
        run: |
          kubectl get ns
          kubectl -n nfs-lab get pvc,pv,po,sc || true
          kubectl -n nfs-lab describe pvc data || true
